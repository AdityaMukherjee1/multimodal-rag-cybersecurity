        event_types: ["Sysmon Event ID 1 (Process Creation)", "Sysmon Event ID 3 (Network Connection)"]
        attck_mappings: ["T1059", "T1218"]
      - name: "4799_remote_local_groups_enumeration.evtx"
        size_bytes: 69632
        modality: "evtx"
        event_types: ["Security Event ID 4799 (Security-Enabled Local Group Member Enumeration)"]
        attck_mappings: ["T1087.002"]
      - name: "Persistence_Winsock_Catalog_Change_EventId_1.evtx"
        size_bytes: 69632
        modality: "evtx"
        event_types: ["Sysmon Event ID 1 (Process Create: netsh / winsock change)"]
        attck_mappings: ["T1546"]
      - name: "CA_DCSync_4662.evtx"
        size_bytes: 69632
        modality: "evtx"
        event_types: ["Security Event ID 4662 (Directory Service Access / DCSync)"]
        attck_mappings: ["T1003.006"]
