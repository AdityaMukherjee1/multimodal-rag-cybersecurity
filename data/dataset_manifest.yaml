        attck_mappings: ["T1003.001"]

  mordor:
    purpose: "ATT&CK-aligned simulated adversary security events"
    authoritative_sources:
      - name: "OTRF Security-Datasets / Mordor Project (Roberto Rodriguez, Jose Luis Rodriguez)"
        url: "https://github.com/OTRF/Security-Datasets"
        website: "https://securitydatasets.com"
        license: "Creative Commons Attribution-ShareAlike 4.0 International (CC BY-SA 4.0)"
    download_date: "2026-09-03"
    storage_path: "data/raw/mordor"
    files:
      - name: "psh_powershell_httplistener_2020-11-0204130683.json"
        archive: "psh_powershell_httplistener.zip"
        modality: "json"
        format: "ndjson"
        tactic: "Execution"
        attck_mappings: ["T1059.001"]
      - name: "cmd_psexec_lsa_secrets_dump_2020-10-1903305471.json"
        archive: "cmd_psexec_lsa_secrets_dump.zip"
        modality: "json"
        format: "ndjson"
        tactic: "Credential Access / Execution"
        attck_mappings: ["T1003", "T1569.002"]
      - name: "cmd_seatbelt_group_user_2020-11-0216391814.json"
        archive: "cmd_seatbelt_group_user.zip"
        modality: "json"
        format: "ndjson"
        tactic: "Discovery"
        attck_mappings: ["T1087", "T1069"]

  cic_ids2017:
    purpose: "Network intrusion telemetry and flow evidence"
    authoritative_sources:
      - name: "Canadian Institute for Cybersecurity (CIC), University of New Brunswick (UNB)"
        url: "https://www.unb.ca/cic/datasets/ids-2017.html"
        license: "Open Academic Research Use"
      - name: "Western University OC2 Lab (Prof. Abdallah Shami)"
        url: "https://github.com/Western-OC2-Lab/Intrusion-Detection-System-Using-Machine-Learning"
        license: "MIT License"
    download_date: "2026-09-03"
    storage_path: "data/raw/cic_ids2017"
    files:
      - name: "cicids2017_representative_sample.csv"
        size_bytes: 1179327
        rows: 3001
        columns: 78
        modality: "network_flow"
        classes: ["BENIGN", "DoS", "PortScan", "DDoS"]
        primary_features:
          - "Flow Duration"
          - "Total Fwd Packets"
          - "Total Backward Packets"
          - "Flow Bytes/s"
          - "Flow Packets/s"
          - "Destination Port"
          - "SYN / ACK / FIN / RST Flag Counts"

  mitre_attack:
    purpose: "Official machine-readable cybersecurity threat knowledge"
    authoritative_sources:
      - name: "MITRE Corporation & Center for Threat-Informed Defense"
        url: "https://github.com/mitre-attack/attack-stix-data"
        license: "Apache License 2.0"
    download_date: "2026-09-03"
    storage_path: "data/raw/mitre_attack"
    files:
      - name: "enterprise-attack.json"
        size_bytes: 53835637
        format: "STIX 2.1 JSON"
        modality: "mitre_attack"
        scope:
          - "Attack Tactics"
          - "Techniques & Sub-techniques"
          - "Adversary Groups & Campaigns"
          - "Software & Malware Profiles"
          - "Mitigations & Data Sources"

  nvd:
    purpose: "Vulnerability knowledge and CVSS severity metrics"
    authoritative_sources:
      - name: "National Institute of Standards and Technology (NIST) NVD API 2.0"
        url: "https://services.nvd.nist.gov/rest/json/cves/2.0"
        license: "U.S. Government Work / Public Domain"
    download_date: "2026-09-03"
    storage_path: "data/raw/nvd"
    files:
      - name: "nvd_cve_sample.json"
        format: "NVD_CVE_JSON_2.0"
        modality: "nvd_cve"
        cves_included:
          - "CVE-2021-44228 (Log4Shell - CVSS 10.0)"
          - "CVE-2017-0144 (EternalBlue - CVSS 8.1)"
          - "CVE-2021-34527 (PrintNightmare - CVSS 8.8)"
          - "CVE-2021-26855 (ProxyLogon - CVSS 9.8)"
          - "CVE-2022-30190 (Follina - CVSS 7.8)"
          - "CVE-2023-34362 (MOVEit SQLi - CVSS 9.8)"
          - "CVE-2023-4966 (Citrix Bleed - CVSS 9.4)"

